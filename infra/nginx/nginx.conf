# nginx.conf for KronosFit
# Serves Next.js static build and proxies API to backend

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # Content-Security-Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:;";
    # HSTS (enable only if you have valid SSL)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting (basic)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream for Django backend
    upstream backend {
        server backend:8000;
    }

    # Serve static files from Next.js build
    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (comment out if not using SSL yet)
        # return 301 https://$host$request_uri;

        root /usr/share/nginx/html;
        index index.html;

        # Next.js static assets
        location /_next/ {
            alias /usr/share/nginx/html/_next/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Service worker and web manifest must never be stale-cached
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Public files (e.g., favicon.ico, manifest.json)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy to Django
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
        }
    }

    # HTTPS server (example, enable when you have certs)
    # server {
    #     listen 443 ssl http2;
    #     server_name _;

    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;

    #     # Same config as above but with SSL
    #     root /usr/share/nginx/html;
    #     index index.html;

    #     location /_next/ {
    #         alias /usr/share/nginx/html/_next/;
    #         access_log off;
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #         try_files $uri =404;
    #     }

    #     location / {
